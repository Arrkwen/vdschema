[project]
name = "vdschema"
version = "0.5.2"
description = "Unified annotation schema and JSONL IO for vision datasets."
readme = "README.md"
authors = [
    { name = "Arrkwen", email = "Arrkwen@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pycocotools>=2.0.7",
]

[project.urls]
Homepage = "https://github.com/Arrkwen/vdschema"
Repository = "https://github.com/Arrkwen/vdschema"
Issues = "https://github.com/Arrkwen/vdschema/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]


[project.scripts]
vdswitch = "vdswitch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vdschema", "vdswitch", "vdswitch.converters", "vdswitch.utils"]

[tool.setuptools.package-data]
vdschema = ["schema/*.json", "schema/*.md"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # pycocotools + NumPy 2.x: RLE decode via __array__(copy=False)
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.ruff]
line-length = 88

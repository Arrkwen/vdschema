[project]
name = "vdschema"
version = "0.7.0"
description = "Unified annotation schema and JSONL IO for vision datasets."
readme = "README.md"
authors = [
    { name = "Arrkwen", email = "Arrkwen@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pycocotools>=2.0.7",
]

[project.optional-dependencies]
vdswitch = [
    "opencv-python-headless>=4.8",
    "pillow>=12.3.0",
    "defusedxml>=0.7",
]

[project.urls]
Homepage = "https://github.com/Arrkwen/vdschema"
Repository = "https://github.com/Arrkwen/vdschema"
Issues = "https://github.com/Arrkwen/vdschema/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a20",
    "pip-audit>=2.7",
    "bandit>=1.8",
    "pre-commit>=4.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
vdswitch = "vdswitch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vdschema", "vdswitch", "vdswitch.converters", "vdswitch.options", "vdswitch.utils"]

[tool.setuptools.package-data]
vdschema = ["schema/*.json", "schema/*.md"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
constraint-dependencies = ["cryptography>=50.0.1", "urllib3>=2.8.0"]

[tool.coverage.run]
source = ["src/vdschema", "src/vdswitch"]

[tool.coverage.report]
precision = 0
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
filterwarnings = [
    # pycocotools + NumPy 2.x: RLE decode via __array__(copy=False)
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.ruff]
line-length = 88
exclude = [".agents", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/vdswitch/converters/registry.py" = ["B010"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src/vdschema", "src/vdswitch"]
exclude = ["src/vdswitch/converters/registry.py"]
